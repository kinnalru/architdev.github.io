# This file is a template, and might need editing before it works on your project.
# Full project: https://gitlab.com/pages/plain-html

image: ruby:3.2-slim

build:
  script:
    - apt-get update -y; apt-get install -y build-essential
    - bundle
    - JEKYLL_ENV=production bundle exec jekyll build --config _config.yml --config _config.gitlab.yml -d ./public/
    - JEKYLL_ENV=production bundle exec jekyll build --config _config.yml --config _config.gitlab.yml -d ./public/pages/kinnalru/
  pages: 
    publish: public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

